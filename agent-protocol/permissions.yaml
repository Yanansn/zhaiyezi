schema_version: 2

actors:
  chat:
    role: decision-agent
  codex:
    role: execution-agent
  user:
    role: approval-authority

roles:
  decision-agent:
    allowed_actions:
      - read_repository
      - create_task
      - create_review
      - create_decision
    owned_paths:
      - decisions/**
      - agent-work/tasks/*/REQUEST.yaml
      - agent-work/tasks/*/REVIEW.yaml
  execution-agent:
    allowed_actions:
      - read_repository
      - repository_read
      - collect_evidence
      - analyze_code
      - repository_modify
      - modify_facts_repository
      - run_tests
      - write_result
      - write_report
      - write_evidence
      - materialize_chat_artifact
      - materialize_user_artifact
    owned_paths:
      - agent-work/tasks/*/RESULT.yaml
      - agent-work/tasks/*/REPORT.md
      - agent-work/tasks/*/evidence/**
      - screenings/**
  approval-authority:
    allowed_actions:
      - approve_protected_action
    owned_paths:
      - agent-work/tasks/*/APPROVAL.yaml

shared_serialized_paths:
  - HANDOFF.md

action_catalog:
  read_repository: local-read
  repository_read: target-repository-read
  repository_modify: target-repository-write
  create_task: local-write
  create_review: local-write
  create_decision: local-write
  collect_evidence: local-write
  analyze_code: local-read
  modify_facts_repository: local-write
  run_tests: local-execution
  write_result: local-write
  write_report: local-write
  write_evidence: local-write
  materialize_chat_artifact: standing-or-task-authorization-required
  materialize_user_artifact: always-user-confirmation-required
  commit_facts_repository: standing-or-task-authorization-required
  push_facts_repository: standing-or-task-authorization-required
  modify_registry: always-user-confirmation-required
  initialize_formal_issue: always-user-confirmation-required
  fetch_official_upstream: always-user-confirmation-required
  modify_upstream_code: always-user-confirmation-required
  upstream_write: always-user-confirmation-required
  push_upstream_branch: always-user-confirmation-required
  create_issue: always-user-confirmation-required
  comment_issue: always-user-confirmation-required
  assign_issue: always-user-confirmation-required
  add_labels: always-user-confirmation-required
  create_pull_request: always-user-confirmation-required

default_prohibited_actions:
  - materialize_user_artifact
  - modify_registry
  - initialize_formal_issue
  - fetch_official_upstream
  - modify_upstream_code
  - upstream_write
  - push_upstream_branch
  - create_issue
  - comment_issue
  - assign_issue
  - add_labels
  - create_pull_request

approval_required_actions:
  - repository_modify
  - materialize_chat_artifact
  - materialize_user_artifact
  - commit_facts_repository
  - push_facts_repository
  - modify_registry
  - initialize_formal_issue
  - fetch_official_upstream
  - modify_upstream_code
  - upstream_write
  - push_upstream_branch
  - create_issue
  - comment_issue
  - assign_issue
  - add_labels
  - create_pull_request

standing_authorizable_actions:
  - commit_facts_repository
  - push_facts_repository
  - materialize_chat_artifact

always_user_confirmation_actions:
  - materialize_user_artifact
  - modify_registry
  - initialize_formal_issue
  - fetch_official_upstream
  - modify_upstream_code
  - upstream_write
  - push_upstream_branch
  - create_issue
  - comment_issue
  - assign_issue
  - add_labels
  - create_pull_request

standing_authorization:
  repository: Yanansn/zhaiyezi
  branch: main
  file_location: decisions/authorizations/*.yaml
  actor_path_allowlist:
    chat:
      - agent-work/tasks/*/REQUEST.yaml
      - agent-work/tasks/*/REVIEW.yaml
      - decisions/**
    codex:
      - agent-work/tasks/*/REQUEST.yaml
      - agent-work/tasks/*/REVIEW.yaml
      - agent-work/tasks/*/RESULT.yaml
      - agent-work/tasks/*/REPORT.md
      - agent-work/tasks/*/evidence/**
      - screenings/**
      - decisions/**

materialization:
  semantic_ownership_transfers: false
  codex:
    materialize_chat_artifact:
      authority: user-instruction
      scope: bounded
      paths:
        - agent-work/tasks/*/REQUEST.yaml
        - agent-work/tasks/*/REVIEW.yaml
        - decisions/**
      excluded_paths:
        - decisions/authorizations/**
    materialize_user_artifact:
      authority: explicit-user-approval
      scope: bounded
      paths:
        - agent-work/tasks/*/APPROVAL.yaml
        - decisions/authorizations/*.yaml
  never_materializable_actions:
    - modify_registry
    - initialize_formal_issue
    - fetch_official_upstream
    - modify_upstream_code
    - upstream_write
    - push_upstream_branch
    - create_issue
    - comment_issue
    - assign_issue
    - add_labels
    - create_pull_request

rules:
  default: deny
  missing_action: prohibited
  task_approval_is_task_scoped: true
  standing_authorization_is_repository_scoped: true
  standing_authorization_is_branch_scoped: true
  standing_authorization_is_actor_action_path_scoped: true
  template_is_not_authorization: true
  materialization_requires_provenance: true
  materialization_does_not_grant_decision_authority: true
  publication_requires_live_identity_verification: true
