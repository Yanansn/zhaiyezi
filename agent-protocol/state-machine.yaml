schema_version: 2

queue_artifact_state:
  states:
    - ready
    - active
    - awaiting-review
    - changes-requested
    - blocked
    - failed
    - rejected
    - completed
  derivation:
    ready:
      rule: REQUEST.status is ready and RESULT.yaml is absent.
    active:
      rule: The newest RESULT.status is active.
    awaiting-review:
      rule: The newest RESULT.status is review and no Review covers that result revision.
    changes-requested:
      rule: REVIEW.decision and REVIEW.status are changes-requested for the current result revision.
    blocked:
      rule: The newest RESULT.status is blocked and limitations contains a blocker.
    failed:
      rule: The newest RESULT.status is failed.
    rejected:
      rule: REVIEW.decision and REVIEW.status are rejected for the current result revision.
    completed:
      rule: REVIEW.decision is approved and REVIEW.status is completed for the current result revision.
  transitions:
    ready: [active, awaiting-review, blocked, failed]
    active: [awaiting-review, blocked, failed]
    awaiting-review: [changes-requested, rejected, completed]
    changes-requested: [active, awaiting-review, blocked, failed]
    blocked: [active, failed]
    failed: []
    rejected: []
    completed: []
  rules:
    fixed_task_directory: true
    directory_moves_prohibited: true
    rejected_tasks_are_retained: true
    changes_requested_review_is_immutable: true
    new_result_revision_may_supersede_changes_requested_review: true
    queue_completed_is_not_contribution_completed: true
    materialization_does_not_change_state: true
    materialization_does_not_transfer_decision_ownership: true

contribution_coordination:
  states:
    - discovered
    - evidence_requested
    - evidence_completed
    - target_repository_binding
    - awaiting_review
    - deep_audit
    - admission_pending
    - implementation_ready
    - implementing
    - verification
    - pr_ready
    - completed
  transitions:
    discovered: [evidence_requested]
    evidence_requested: [evidence_completed]
    evidence_completed: [target_repository_binding]
    target_repository_binding: [deep_audit]
    deep_audit: [awaiting_review]
    awaiting_review: [admission_pending]
    admission_pending: [implementation_ready]
    implementation_ready: [implementing]
    implementing: [verification]
    verification: [pr_ready]
    pr_ready: [completed]
    completed: []
  gates:
    target_repository_binding_to_deep_audit:
      owner: chat
      rule: A target repository must be bound before Deep Audit; binding does not authorize upstream writes.
    awaiting_review_to_admission_pending:
      owner: chat
      rule: Deep Audit must be reviewed before using the existing Screening classification and Candidate Admission Gate contract.
    admission_pending_to_implementation_ready:
      owner: user
      rule: Gate passage and repository mutations require independent authorization.
    implementation_ready_to_implementing:
      owner: chat
      rule: A bounded implementation REQUEST.yaml is required.
    pr_ready_to_completed:
      owner: chat
      rule: Existing submitted, reviewing, and terminal Issue statuses remain authoritative for real PRs.

forbidden_shortcuts:
  - [evidence_completed, awaiting_review]
  - [evidence_completed, admission_pending]
  - [evidence_completed, implementation_ready]
  - [evidence_completed, deep_audit]
  - [target_repository_binding, awaiting_review]
  - [deep_audit, admission_pending]
  - [deep_audit, implementation_ready]
  - [awaiting_review, implementation_ready]
  - [admission_pending, implementing]

compatibility:
  screening_classification_source: .agents/skills/screen-open-source-issue/references/output-schema.md
  admission_source: .agents/skills/screen-open-source-issue/references/candidate-admission-gate.md
  issue_status_source: AGENTS.md
  harvest_source: .agents/skills/harvest-open-source-issue/SKILL.md
