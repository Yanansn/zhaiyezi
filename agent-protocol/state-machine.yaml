schema_version: 2

queue_artifact_state:
  states: [ready, active, awaiting-decision, changes-requested, blocked, failed, rejected, completed]
  derivation:
    ready: {rule: REQUEST.status is ready and RESULT.yaml is absent.}
    active: {rule: RESULT.status is active.}
    awaiting-decision: {rule: RESULT.status is decision and no DECISION covers that result revision.}
    changes-requested: {rule: DECISION.status is changes-requested.}
    blocked: {rule: RESULT.status is blocked and limitations contains a blocker.}
    failed: {rule: RESULT.status is failed.}
    rejected: {rule: DECISION.status is rejected.}
    completed: {rule: DECISION.status is completed, or screening-record RESULT.status is completed.}
  transitions:
    ready: [active, awaiting-decision, blocked, failed]
    active: [awaiting-decision, blocked, failed]
    awaiting-decision: [changes-requested, rejected, completed]
    changes-requested: [active, awaiting-decision, blocked, failed]
    blocked: [active, failed]
    failed: []
    rejected: []
    completed: []
  rules:
    fixed_task_directory: true
    directory_moves_prohibited: true
    current_decision_required: false

contribution_coordination:
  states: [candidate, evidence, analysis, decision, implementation, pull-request]
  transitions:
    candidate: [evidence]
    evidence: [analysis]
    analysis: [decision]
    decision: [implementation]
    implementation: [pull-request]
    pull-request: []
  gates:
    evidence_to_analysis: {owner: agent:terra, rule: Evidence must be recorded before source analysis.}
    analysis_to_decision: {owner: agent:luna, rule: A decision proposal records conclusion, confidence, evidence, risks, and next action.}
    decision_to_implementation: {owner: agent:terra, rule: Implementation requires an accepted Agent decision and a bounded task.}
    implementation_to_pull_request: {owner: user, rule: Target fork Push, PR creation, and public GitHub actions require explicit User approval.}

agent_handoff:
  mode: optional
  automatic_model_switch: false
  rule: assigned_agent controls task ownership and permissions; it does not select or switch the underlying model.
  completion_requirement: Handoff metadata is optional; create a new task only when the next stage is authorized.
  recommendations:
    candidate: agent:luna
    evidence: agent:luna
    analysis: agent:terra
    decision: agent:luna
    implementation: agent:terra
    pull-request: user

forbidden_shortcuts: [[candidate, analysis], [candidate, decision], [evidence, decision], [evidence, implementation], [analysis, implementation], [decision, pull-request]]
