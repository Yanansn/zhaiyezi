schema_version: 4

task_directory: agent-work/tasks/<task-id>

request:
  filename: REQUEST.yaml
  owner: assigned-agent
  required_fields: [schema_version, task_id, task_type, created_by, decision_author, materialized_by, assigned_agent, repository, issue, status, input_refs, goal, allowed_actions, prohibited_actions, expected_outputs, approval_required]
  optional_fields: [created_at, priority, target_repository, evidence_refs]
  constraints:
    schema_version: 2
    status: ready
    approval_required: boolean
    immutable_after_execution_starts: true

result:
  filename: RESULT.yaml
  owner: agent:luna-or-agent:terra
  required_fields: [schema_version, task_id, created_by, decision_author, materialized_by, status, request_ref, outputs, actions_performed, actions_not_performed, validation, limitations]
  optional_fields: [revision, issue_type]

decision:
  filename: DECISION.yaml
  owner: agent:luna-or-agent:terra-or-agent:sol
  required_fields: [schema_version, task_id, created_by, decision_author, materialized_by, status, result_ref, result_revision, conclusion, confidence, evidence_refs, risks, next_action]

approval:
  filename: APPROVAL.yaml
  owner: user
  required_fields: [schema_version, task_id, approved_by, decision_author, materialized_by, status, actions, scope]

enums:
  task_type: [evidence-collection, deep-audit, screening-record, code-verification, ecosystem-analysis, code-map, plan, implementation, validation, publication]
  created_by: [agent:luna, agent:terra, agent:sol, user]
  decision_author: [agent:luna, agent:terra, agent:sol, user]
  materialized_by: [agent:luna, agent:terra, agent:sol, user]
  assigned_agent: [agent:luna, agent:terra, agent:sol]
  request_status: [ready]
  result_status: [active, decision, completed, blocked, failed]
  decision_status: [completed, changes-requested, rejected]
  decision_confidence: [low, medium, high]
  approval_status: [approved, revoked]
  priority: [low, normal, high, urgent]
  issue_type: [observability-enhancement]

task_type_contracts:
  deep-audit:
    purpose: Analyze completed evidence and produce a contribution screening recommendation.
    input: [evidence collection result, related PR information, source facts]
    output: [RESULT.yaml]
    optional_artifacts: [REPORT.md, DECISION.yaml]
    required_request_fields: [evidence_refs]
    prohibited_allowed_actions: [modify_upstream_code, upstream_write, push_upstream_branch, create_pull_request]
    does_not_authorize: [admission, implementation authorization, upstream contribution]
  screening-record:
    purpose: Decide whether an Issue merits bounded further investigation or contribution work.
    input: [Issue metadata, public related-work signals, source or runtime facts when available]
    output: [RESULT.yaml]
    required_result_fields: [classification, confidence, evidence_refs, feasibility, next_action]
    optional_artifacts: [REPORT.md]
    does_not_authorize: [admission, implementation authorization, upstream contribution]
  implementation:
    required_request_fields: [target_repository]
    required_target_repository_fields: [name, phase, fork, local]

target_repository_contract:
  phases: [evidence, deep-audit, implementation]
  required_fields: [name, phase]
  implementation_required_fields: [fork, local]
  local_discovery_field: discovery

completion_contract:
  required_fields: [criteria, validation, handoff]
  handoff:
    required_fields: [next_stage, recommended_agent, message]
    recommended_agents: [agent:luna, agent:terra, agent:sol, user]
  completed_requires_agent_decision: false
  protected_actions_require_user_approval: true

compatibility:
  current_artifact_schema_version: 2
  optional_decision_artifact: DECISION.yaml
  current_agents: [agent:luna, agent:terra, agent:sol]
  repository_binding_evidence_and_screening_retained: true
