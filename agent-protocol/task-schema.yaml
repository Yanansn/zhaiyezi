schema_version: 3

task_directory: agent-work/tasks/<task-id>

request:
  filename: REQUEST.yaml
  owner: chat
  required_fields:
    - schema_version
    - task_id
    - task_type
    - created_by
    - decision_author
    - materialized_by
    - assigned_agent
    - repository
    - issue
    - status
    - input_refs
    - goal
    - allowed_actions
    - prohibited_actions
    - expected_outputs
    - completion
  optional_fields:
    - created_at
    - priority
    - materialization
  constraints:
    status: ready
    immutable_after_execution_starts: true

result:
  filename: RESULT.yaml
  owner: codex
  required_fields:
    - schema_version
    - task_id
    - created_by
    - decision_author
    - materialized_by
    - status
    - request_ref
    - outputs
    - actions_performed
    - actions_not_performed
    - validation
    - limitations
  optional_fields:
    - revision
    - supersedes_review

review:
  filename: REVIEW.yaml
  owner: chat
  required_fields:
    - schema_version
    - task_id
    - created_by
    - decision_author
    - materialized_by
    - status
    - result_ref
    - result_revision
    - decision
    - findings
    - next_actions
  optional_fields:
    - materialization

approval:
  filename: APPROVAL.yaml
  owner: user
  required_fields:
    - schema_version
    - task_id
    - approved_by
    - decision_author
    - materialized_by
    - status
    - actions
    - scope
  optional_fields:
    - materialization

standing_authorization:
  kind: standing-authorization
  actual_location: decisions/authorizations/<authorization-id>.yaml
  template_location: agent-protocol/examples/standing-authorization.yaml
  required_fields:
    - schema_version
    - kind
    - authorization_id
    - approved_by
    - decision_author
    - materialized_by
    - status
    - repository
    - branch
    - effective_from
    - expires_at
    - grants
    - always_requires_new_approval
    - revocation
  optional_fields:
    - materialization

materialization_contract:
  condition: materialized_by differs from decision_author
  required_fields:
    - authority
    - scope
    - source_summary
  authority: [user-instruction]
  scope: [bounded]

enums:
  task_type:
    - example
    - evidence-collection
    - screening-record
    - code-verification
    - ecosystem-analysis
    - code-map
    - plan
    - implementation
    - validation
    - publication
    - review
    - documentation-contract-update
  created_by: [chat, codex, user]
  decision_author: [chat, codex, user]
  materialized_by: [chat, codex, user]
  assigned_agent: [chat, codex]
  request_status: [ready]
  result_status: [active, review, blocked, failed]
  review_status: [completed, changes-requested, rejected]
  review_decision: [approved, changes-requested, rejected]
  approval_status: [approved, revoked]
  standing_authorization_status: [approved, revoked]
  priority: [low, normal, high, urgent]

artifact_state_derivation:
  request_ready_without_result: ready
  result_active: active
  result_review: awaiting-review
  result_blocked: blocked
  result_failed: failed
  review_approved_completed: completed
  review_changes_requested: changes-requested
  review_rejected: rejected
  newer_result_after_changes_requested: derive-from-newer-result

completion_contract:
  required_fields: [criteria, validation, handoff]
  completed_requires_approved_review: true
  protected_actions_require_task_or_valid_standing_authorization: true

compatibility:
  coordination_status_is_not_screening_classification: true
  coordination_status_is_not_issue_status: true
  queue_completed_is_not_contribution_completed: true
  evidence_completed_is_not_available: true
  evidence_completed_is_not_admission: true
  semantic_ownership_is_not_materialization: true
  delegated_materialization_does_not_expand_permissions: true
