source_facts:
  - file: lmcache/integration/vllm/lmcache_mp_connector.py
    symbols:
      - LMCacheMPConnector
      - LMCacheMPConnector.start_load_kv
      - LMCacheMPSchedulerAdapter
    fact: >-
      LMCacheMPConnector validates mamba step alignment, builds scheduler and
      worker adapters from vLLM config, reads lmcache.mp extra config, and
      submits batched retrieve requests from start_load_kv.
  - file: lmcache/integration/vllm/vllm_multi_process_adapter.py
    symbols:
      - LMCacheMPSchedulerAdapter
      - lmcache_tokens_per_chunk
      - blocks_in_chunk
    fact: >-
      The scheduler adapter reads LMCache chunk size from the MP server and
      derives blocks_in_chunk from LMCache chunk size and vLLM block size.
  - file: lmcache/v1/platform/cpu/cache_context.py
    symbols:
      - CPUCacheContext
      - tmp_cpu_buffer_
      - get_tmp_chunk_gpu_buffer_batched
    fact: >-
      CPU cache context builds KV layer groups, optionally enables full
      sliding-window KV behavior, and allocates a CPU temporary transfer buffer
      sized from per-group chunk shapes and max_batch_size.
  - file: lmcache/v1/kv_layer_groups.py
    symbols:
      - ObjectGroupInfo
      - KVLayerGroupsManager.enable_full_sw_kv
      - KVLayerGroupsManager.get_subchunk_sw_size_tokens
    fact: >-
      KV layer grouping explicitly models sliding-window or mamba KV caches,
      and full_sw_kv changes the reported window size to the full LMCache chunk.
  - file: lmcache/v1/distributed/memory_manager/l1_memory_manager.py
    symbols:
      - create_memory_allocator
      - L1MemoryManager.allocate
    fact: >-
      L1 memory allocation chooses LazyMemoryAllocator or MixedMemoryAllocator
      from config; a configured SHM name is normalized and used for
      MixedMemoryAllocator.
  - file: tests/v1/multiprocess/test_engine_driven_transfer.py
    symbols:
      - test_engine_context_shm_pool_info
      - test_server_engine_driven_reregister_returns_existing_shm_response
      - test_engine_driven_context_shm_store_retrieve_flow_with_mocked_mq
    fact: >-
      Existing tests cover engine-driven transfer and SHM context behavior, but
      this screening did not find a test dedicated to mamba-cache-mode align
      memory growth.

