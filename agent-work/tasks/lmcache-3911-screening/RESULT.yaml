issue_summary:
  reported_behavior: >-
    The reporter states that Qwen/Qwen3.5-2B with --mamba-cache-mode align and
    LMCacheMPConnector using engine_driven SHM transfer causes vLLM worker CPU
    RAM to exceed 100 GB during startup. The reporter also states that removing
    either flag restores normal RAM usage.
  follow_up_signal: >-
    A contributor suggested trying lmcache-driven transfer mode; the reporter
    replied that RAM still spiked, from 80 GB to 250 GB.
  maintainer_intent: >-
    No assignee, labels, milestone, project item, linked development item, or
    maintainer acceptance signal was visible in the issue metadata read for this
    screening.

