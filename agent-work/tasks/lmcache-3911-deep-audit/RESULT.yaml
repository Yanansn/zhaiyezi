technical_analysis:
  source_confirmed:
    - "The align-mode guard constrains block_size <= max_num_batched_tokens < 2*block_size, but it does not inspect CPU memory size or SHM pool sizing."
    - "The CPU temporary buffer is allocated at context construction, before request-level retrieve calls, and its size depends on group shapes, chunk size, dtype, and fixed max_batch_size."
    - "The engine-driven SHM worker path uses server-returned slot descriptors rather than allocating a new full model-sized tensor for each retrieve call in the inspected worker code."
    - "The inspected source does not provide enough evidence to map the reported 100-250 GB growth to one allocation site."
  unresolved:
    - "The exact vLLM version and runtime KV group shapes for Qwen/Qwen3.5-2B are not available locally."
    - "The server-side calculation of engine-driven SHM pool size and slot allocation must be measured in the reporter's image/configuration."
    - "The interaction between max_local_cpu_size, CPUCacheContext, engine-driven SHM, and vLLM startup allocation remains unverified."

