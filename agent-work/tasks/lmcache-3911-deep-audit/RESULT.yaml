issue_validity:
  reported_behavior:
    - "The reporter states that Qwen/Qwen3.5-2B with --mamba-cache-mode align and LMCacheMPConnector engine_driven SHM causes vLLM worker CPU RAM to exceed 100 GB during startup."
    - "The reporter states that removing either flag restores normal RAM usage."
    - "The reporter later states that lmcache-driven mode also caused RAM to rise from 80 GB to 250 GB."
  source_confirmed_behavior:
    - "LMCacheMPConnector validates mamba step alignment during construction, then creates scheduler and worker adapters."
    - "LMCacheMPConnector registers edited KV caches and engine group information before worker transfer registration."
    - "start_load_kv collects RETRIEVE metadata and submits batched retrieve requests to the worker adapter."
    - "The worker engine-driven adapter registers a layout-derived context and selects SHM when the server returns a non-empty SHM name and positive pool size; otherwise it uses pickle."
    - "EngineDrivenContextShm creates tensor views over server-provided SHM slot descriptors and releases retrieve slots through commit_retrieve."
    - "CPUCacheContext allocates a block-id tensor with capacity 1,000,000 and a temporary CPU transfer buffer sized as tmp_chunk_bytes times max_batch_size, where max_batch_size is 4."
    - "KV layer grouping models hybrid, sliding-window, and mamba-related group geometry; full_sw_kv changes the reported window size to the full LMCache chunk."
  runtime_confirmed_behavior: []
  confirmed_issue_conclusion: "The public report is concrete and the relevant allocation/transfer paths exist, but the reported magnitude and causal interaction are not runtime-confirmed."

