  reported_behavior: >-
    The Issue reports that llm-d lacks TPU hardware and interconnect telemetry
    integration, including a TPU metrics exporter PodMonitor, recording rules,
    a Grafana dashboard, and corresponding documentation.
  source_confirmed: >-
    The repository has generic model-server PodMonitor components, a Prometheus
    and Grafana installer, existing Grafana dashboards, and TPU deployment
