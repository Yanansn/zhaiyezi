  references:
    - path: lmcache/v1/compute/blend/blender.py
      locations: [19, 47, 54, 60, 71, 81, 89, 110, 116, 123, 137, 150, 153, 166]
      facts:
        - LMCBlender constructs one LMCBlendMetadata instance and stores it as self.metadata.
        - process_qkv reads old_k and old_v from gpu_connector.get_kv(layer_id), computes a difference on check layers, stores imp_indices and updates old_k/old_v at those indices.
        - blend_layer creates layerwise model and retriever generators, advances them across layers, calls self.metadata.clean() near the end, and yields between stages.
        - blend converts list tokens to a tensor, creates the blend_layer generator, and advances it num_layers + 2 times.
    - path: lmcache/v1/compute/blend/metadata.py
      locations: [22, 31]
      facts:
        - LMCBlendMetadata has imp_indices, attn_mask, and positions fields.
        - clean sets all three fields to None.
    - path: lmcache/v1/compute/blend/utils.py
      locations: [22, 37, 46, 48, 51]
      facts:
        - LMCBlenderBuilder stores blenders in class variable _blenders keyed by instance_id.
        - get_or_create returns an existing blender for an existing instance_id and otherwise constructs and stores one.
    - path: lmcache/v1/gpu_connector/gpu_connectors.py
      locations: [679, 758, 763, 766, 839, 844, 860, 870, 899, 929, 933]
      facts:
        - VLLMBufferLayerwiseGPUConnector stores a buffer_mapping keyed by layer id.
        - get_kv returns gpu_buffer[0] and gpu_buffer[1] from the mapped MemoryObj tensor.
        - batched_to_gpu allocates compute and load GPU buffer objects using a shape derived from num_all_tokens, fills them in a layerwise generator, assigns them into buffer_mapping, deletes earlier mappings, releases the final buffers, and asserts buffer_mapping is empty at the end.
    - path: lmcache/integration/vllm/vllm_v1_adapter.py
      locations: [546, 763, 796, 831, 838]
      facts:
        - Connector initialization obtains the blender through LMCBlenderBuilder.get_or_create when blending is enabled.
        - start_load_kv iterates metadata requests, sets self.layerwise_retrievers to an empty list, and calls self.blender.blend for each eligible layerwise blending request.
        - The blend call receives the request token prefix, token mask, kvcaches, slot mapping prefix, and vllm_cached_tokens.
    - path: tests/
      locations: []
      facts:
        - Filename search for blend, blender, and cacheblend found no direct unit-test file for LMCBlender, LMCBlendMetadata, or blend_layer; matches were in unrelated blend-client/directory or connector tests.
