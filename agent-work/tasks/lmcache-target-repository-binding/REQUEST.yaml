task_type: code-verification
created_by: chat
decision_author: chat
materialized_by: codex
materialization:
  authority: user-instruction
  scope: bounded
  source_summary: Chat authorized a bounded runtime binding verification for the LMCache target repository without source modification or public actions.
assigned_agent: codex
repository: LMCache/LMCache
issue: null
status: ready
priority: normal
input_refs:
  - AGENTS.md
  - HANDOFF.md
  - agent-protocol/
  - repositories/registry.yaml
  - repositories/discovery.yaml
  - scripts/repository_discovery.py
goal: Verify the trustworthy runtime binding for LMCache/LMCache, including local repository discovery, upstream and fork remotes, verified fork ownership, Git identity, baseline state, and registry fork configuration, without modifying LMCache source or performing public actions.
allowed_actions:
  - read_repository
  - repository_read
  - analyze_code
  - run_tests
  - write_result
  - write_report
  - materialize_chat_artifact
  - modify_registry
  - commit_facts_repository
  - push_facts_repository
prohibited_actions:
  - repository_modify
  - initialize_formal_issue
  - modify_upstream_code
  - upstream_write
  - push_upstream_branch
  - create_issue
  - comment_issue
  - assign_issue
  - add_labels
  - create_pull_request
expected_outputs:
  - agent-work/tasks/lmcache-target-repository-binding/REQUEST.yaml
  - agent-work/tasks/lmcache-target-repository-binding/RESULT.yaml
  - agent-work/tasks/lmcache-target-repository-binding/REPORT.md
completion:
  criteria:
    - Local LMCache repository is discovered from configured runtime roots and remotes are recorded.
    - Fork ownership and parent repository are verified read-only through GitHub metadata.
    - Git identity and upstream synchronization limits are recorded.
    - Registry fork URL is updated only to the verified bzsuni/LMCache fork.
    - No LMCache source, branch, history, or public artifact is modified or created.
  validation:
    - python3 scripts/validate_agent_protocol.py
    - python3 scripts/repository_discovery.py list
    - python3 -m unittest tests.test_agent_protocol
    - python3 -m unittest tests.test_repository_agnostic_contracts
    - python3 -m unittest tests.test_screening_records
    - git diff --check
  handoff: Binding result is reviewable; it does not authorize implementation or upstream contribution.
