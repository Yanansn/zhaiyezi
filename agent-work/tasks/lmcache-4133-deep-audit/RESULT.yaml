code_path_map:
  - file: lmcache/v1/compute/blend/utils.py
    symbols: [LMCBlenderBuilder.get_or_create, LMCBlenderBuilder._blenders]
    relationship: "Class-level singleton cache keyed by instance_id; repeated calls return the original blender without reset or removal."
  - file: lmcache/v1/compute/blend/blender.py
    symbols: [LMCBlender, LMCBlender.blend, LMCBlender.blend_layer, LMCBlender.process_qkv]
    relationship: "blend drives a generator across layers; process_qkv reads connector KV and shared metadata; blend_layer cleans metadata only after the generator reaches its normal final steps."
  - file: lmcache/v1/compute/blend/metadata.py
    symbols: [LMCBlendMetadata, LMCBlendMetadata.clean]
    relationship: "Mutable tensors imp_indices, attn_mask, and positions are stored on the blender instance and cleared by clean()."
  - file: lmcache/v1/cache_engine.py
    symbols: [LMCacheEngine.lookup, LMCacheEngine.retrieve_layer, LMCacheEngine.lookup_unpin]
    relationship: "lookup can pin layer keys under lookup_pins; retrieve_layer discovers by first-layer contains without pin, asynchronously obtains each layer, and unpins staging objects only after device synchronization; lookup_unpin later releases lookup pins."
  - file: lmcache/v1/storage_backend/storage_manager.py
    symbols: [StorageManager.batched_contains, StorageManager.layerwise_batched_get, StorageManager.batched_unpin]
    relationship: "Batched lookup aggregates backend hits and pins when requested; layerwise get delegates per-layer async reads to the selected backend."
  - file: lmcache/v1/storage_backend/local_cpu_backend.py
    symbols: [LocalCPUBackend.contains, LocalCPUBackend.batched_get_non_blocking, LocalCPUBackend.unpin]
    relationship: "The LocalCPU hot cache is protected by cpu_lock; contains(pin=True) pins, batched get increments references, and unpin decrements pin_count."
  - file: lmcache/integration/vllm/vllm_v1_adapter.py
    symbols: [LMCacheConnectorV1Impl._init_connector_state, LMCacheConnectorV1Impl.start_load_kv, LMCacheConnectorV1Impl.wait_for_save]
    relationship: "The connector creates or reuses the blender, invokes blending in the layerwise load path, and later calls lookup_unpin during save finalization."
  - file: lmcache/v1/gpu_connector/gpu_connectors.py
    symbols: [GPUConnector.batched_to_gpu]
    relationship: "The layerwise generator stages per-layer memory objects into GPU KV cache and advances through generator synchronization points; the inspected path documents persistent/lazy staging behavior."
  - file: lmcache/v1/compute/models/base.py
    symbols: [LMCBaseModel.compute_layer]
    relationship: "The model executor calls blender.process_qkv for every layer and then reshapes the returned q/k/v tensors for attention."

