issue_validity:
  reported_behavior:
    - "The reporter describes lookup promising more tokens than layerwise retrieve stages under CPU-cache eviction pressure."
    - "The reporter describes a mismatch reaching process_qkv and an exception escaping vLLM start_load_kv, followed by engine termination."
    - "The reporter states the workload uses layerwise retrieval, blending, LocalCPU cache pressure, and can reproduce in approximately ten minutes."
  source_confirmed_behavior:
    - "The vLLM adapter performs a pin=True lookup through the lookup client before the worker-side start_load_kv path."
    - "Layerwise lookup checks all layer keys with batched_contains and records pinned keys in lookup_pins when pin=True."
    - "The layerwise retrieve path checks only the first layer with storage_manager.contains(..., pin=False), then retrieves each layer through layerwise_batched_get."
    - "LocalCPUBackend.contains(..., pin=True) increments MemoryObj.pin_count, while LocalCPUBackend.batched_get_non_blocking increments ref_count without pinning."
    - "The blender is cached in a class-level dictionary keyed by ENGINE_NAME and is returned again by get_or_create."
    - "LMCBlender carries mutable per-operation metadata and clears it only at the normal end of blend_layer."
    - "The vLLM layerwise blending branch calls blender.blend without receiving a retrieval mask or checking a partial-retrieve result."
  runtime_confirmed_behavior: []

