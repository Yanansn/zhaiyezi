risks:
  - "The source facts show a lookup/retrieve lifecycle gap, but do not prove that it is the sole cause of the reported crash."
  - "The class-level blender and mutable metadata are shared by an engine instance, but request concurrency and generator scheduling need runtime confirmation before assigning them as the root cause."
  - "A defensive fallback must preserve vLLM request isolation and avoid masking partial retrieval or leaking pins."

