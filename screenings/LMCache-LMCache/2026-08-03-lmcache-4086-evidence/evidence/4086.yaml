        I agree with you that this is a bug. However, the current code is in the non-MP mode, which will be gradually deprecated in Q3-Q4. If you want to still create a PR to fix this, we are happy to review it and get it merged.

        We are going to add Multi-Modal support in MP mode in Q3 soon. If you are interested, please stay tuned, thanks!

