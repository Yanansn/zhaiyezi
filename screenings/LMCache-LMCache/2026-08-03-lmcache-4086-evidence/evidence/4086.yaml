body:
  complete: true
  text: |
    **Describe the bug**
    When using LMCache with vLLM for multimodal (vision) requests, if two requests share the **identical text prompt (`question`)** but target **different images**, LMCache incorrectly returns a cache hit from a previous image's KV cache. This causes the LLM to hallucinate a seamless concatenation/splice of two different images in its vision analysis output.

    The root cause is that the KV cache key (chunk_hash) is computed from token IDs via prefix hash, but the multimodal hash injection (`apply_mm_hashes_to_token_ids`) either:
    1. Is not executed (mm_features empty/not passed through the request pipeline), or
    2. Uses only a 16-bit int (`hex_hash_to_int16`) to represent the image hash, creating a high collision surface (1/65536), or
    3. Is executed AFTER the chunk_hash is computed in some code paths

    As a result, different images with the same text prompt produce identical chunk_hashes, causing LMCache to return wrong KV entries.

    **To Reproduce**
    Steps to reproduce the behavior:
    1. Setup: vLLM + LMCache (v0.5.0, chunk_size=256, L1 CPU 60GB, L2 disk 200GB, enable_blending=False)
    2. Send vision request A: `vision_analyze(image=A.jpg, question="這是一張什麼圖片？詳細描述所有細節...")`
    3. Send vision request B: `vision_analyze(image=B.jpg, question="這是一張什麼圖片？詳細描述所有細節...")` (same question text, different image)
    4. Observe: Request B's analysis describes a hybrid of image A and image B (e.g., image A's UI elements floating over image B's subject)
    5. Workaround confirmed: Prepend random digits to the question (`7382910283 這是一張什麼圖片...`) and request B returns correct analysis

    **Expected behavior**
    Each image should produce a unique KV cache key, regardless of whether the text prompt is identical. Different images must never share KV cache entries.

    **Actual behavior**
    - Image A (`d34dd879...jpg`): Correctly analyzed as Android home screen
    - Image B (`7a65eaf5...jpg`): Incorrectly analyzed as a hybrid of Android home screen + woman's legs (image A's content spliced into image B's analysis)
    - Image B with modified question: Correctly analyzed as Cosplay character

    All image files verified on disk as correct. Base64 payload verified as correct. The bug is exclusively at the LMCache KV cache lookup layer.

    **Environment**
    - LMCache version: 0.5.0 (commit g389b9cfc)
    - vLLM: integrated via lmcache_mp_connector
    - Model: Qwen3.6-27B-AWQ-INT4
    - Config: chunk_size=256, local_cpu=true, max_local_cpu_size=60, local_disk=200GB, enable_blending=False
    - OS: Ubuntu 24.04.4 LTS, AMD Athlon 3000G, 78GB RAM, 2x RTX 3080
    - Python: 3.12

    **Root Cause Analysis**

    The issue is in the multimodal hash injection pipeline:

    1. **`lmcache/integration/vllm/utils.py` L171-L188**: `apply_mm_hashes_to_token_ids()` overwrites placeholder tokens with `hex_hash_to_int16(hash_str)` — a 16-bit integer. This means the entire placeholder range (often 64-1280 tokens) is filled with a single 16-bit value, giving only 65536 possible representations for all images.

    2. **`lmcache/v1/token_database.py` L291-L293**: `extra_keys` parameter in `_hash_tokens()` is explicitly ignored:
       ```python
       # Ignore extra keys for now
       # Extra keys are for multi-modal inputs and
       # request specific metadata (e.g., LoRA ID).
       ```
       This means even if `extra_keys` were passed with multimodal identifiers, they would not affect the chunk_hash.

    3. **`lmcache/integration/vllm/vllm_v1_adapter.py` L1402-L1411**: The mm hash injection happens before `lookup()`, but only if `mm_hashes and mm_positions` are both non-empty. If the request pipeline (e.g., through llama-swap router or non-standard entry points) does not populate `mm_features` correctly, `extract_mm_features()` returns `([], [])` and the injection becomes a no-op.

    **Proposed Fix**

    **Option 1 (Recommended)**: Include multimodal identifiers in the chunk_hash computation
    - Remove the `# Ignore extra keys for now` comment in `token_database.py` and actually incorporate `extra_keys` into the hash
    - Pass `mm_hashes` as `extra_keys` through `process_tokens()` → `_hash_tokens()`
    - This ensures different images always produce different chunk_hashes regardless of text prompt

    **Option 2**: Use full hash (not 16-bit truncation) for multimodal token injection
    - Replace `hex_hash_to_int16()` with a function that uses more bits (e.g., 64-bit or full SHA-256)
    - Fill placeholder tokens with a pattern derived from the full hash, not a single repeated int16

    **Option 3**: Add multimodal hash to `CacheEngineKey` or `ObjectKey` directly
    - Extend `CacheEngineKey` or `ObjectKey` with an optional `mm_hash` field
    - Include it in the serialized key so that multimodal requests are always isolated from text-only and cross-image collisions

    **Additional context**

    This bug is silently producing incorrect results with no error signal. The LLM returns confident but completely fabricated analysis that appears plausible (describing elements from both images). This is especially dangerous in production environments where users cannot easily verify the correctness of vision analysis.

    The workaround (adding unique text to each question) confirms that the issue is purely a cache key collision — any change to the text prefix produces a different chunk_hash and avoids the bug.

